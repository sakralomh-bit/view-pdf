<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="https://sakralomh-bit.github.io/view-pdf/pdf/UV%20GULF.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض الشهادة</title>
    <style>
        body { margin: 0; padding: 0; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
        .pdf-container { width: 90%; max-width: 900px; height: 85vh; background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; }
        .message { text-align: center; padding: 40px; color: #555; }
        .error { color: #d32f2f; }
    </style>
</head>
<body>
    <div class="pdf-container" id="container">
        <p class="message">جاري تحميل المستند...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const certificateId = urlParams.get('certificate');
        const container = document.getElementById('container');

        if (certificateId) {
            const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbyPMfMDJNHe3JQ4x2ZiRUKejIoZc3ZSWCbeaAFyKd4HBrEjam-OTo6UjNf-Ba7fP94n/exec'; 
            
            fetch(`${appsScriptUrl}?certificate=${certificateId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        // استخدام embed يضمن عرض PDF مباشرة في معظم المتصفحات بدون واجهات خارجية
                        container.innerHTML = `<embed src="${data.url}" type="application/pdf" width="100%" height="100%" />`;
                    } else {
                        container.innerHTML = `<p class="message error">${data.message}</p>`;
                    }
                })
                .catch(() => {
                    container.innerHTML = `<p class="message error">فشل في الاتصال بالخادم. تحقق من الاتصال بالإنترنت.</p>`;
                });
        } else {
            container.innerHTML = `<p class="message error">لم يتم تحديد رقم العرض في الرابط.</p>`;
        }
    </script>
</body>
</html>
