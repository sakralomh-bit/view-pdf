<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="https://sakralomh-bit.github.io/view-pdf/pdf/UV%20GULF.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض الوثيقة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f0f2f5; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; }
        .doc-container { width: 100%; max-width: 900px; height: 90vh; background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.1); overflow: hidden; display: flex; flex-direction: column; }
        .toolbar { background: #1e293b; color: #fff; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .toolbar .title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .toolbar .actions { display: flex; gap: 6px; }
        .toolbar button { background: #334155; color: #fff; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; transition: .2s; }
        .toolbar button:hover { background: #475569; }
        .toolbar button.primary { background: #2563eb; }
        .toolbar button.primary:hover { background: #1d4ed8; }
        .doc-content { flex: 1; width: 100%; border: none; background: #fff; }
        .message { text-align: center; padding: 40px; color: #555; font-size: 16px; margin: auto; }
        .error { color: #d32f2f; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        .fallback-link { display: inline-block; margin-top: 12px; padding: 10px 18px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px; }
        @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
    </style>
</head>
<body>
    <div class="doc-container" id="container">
        <div class="message"><div class="loader"></div><div>جاري تحميل الوثيقة...</div></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const certificateId = urlParams.get('certificate');
        const container = document.getElementById('container');
        const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbyPMfMDJNHe3JQ4x2ZiRUKejIoZc3ZSWCbeaAFyKd4HBrEjam-OTo6UjNf-Ba7fP94n/exec';

        function showError(msg, extra = '') {
            container.innerHTML = `<div class="message error">⚠️ ${msg}</div>${extra}`;
        }

        function renderToolbar(dataUrl, mimeType, fileName) {
            return `
                <div class="toolbar">
                    <div class="title">📄 ${fileName || 'الوثيقة'}</div>
                    <div class="actions">
                        <button onclick="window.open('${dataUrl}', '_blank')">🗗 فتح</button>
                        <button onclick="downloadFile('${dataUrl}', '${fileName}')">⬇ تحميل</button>
                        <button class="primary" onclick="printFile('${dataUrl}')">🖨 طباعة</button>
                    </div>
                </div>`;
        }

        window.downloadFile = (dataUrl, name) => {
            const a = document.createElement('a');
            a.href = dataUrl; a.download = name || 'document.pdf'; a.click();
        };

        window.printFile = (dataUrl) => {
            const w = window.open('');
            w.document.write(`<iframe src="${dataUrl}" onload="window.print()" style="width:100%;height:100%;border:none"></iframe>`);
        };

        if (certificateId) {
            fetch(`${appsScriptUrl}?certificate=${certificateId}`)
                .then(r => r.json())
                .then(data => {
                    if (!data.success) return showError(data.message);

                    const dataUrl = `data:${data.mimeType};base64,${data.base64}`;
                    const fileName = data.name || `document-${certificateId}`;

                    if (data.mimeType.includes('image')) {
                        container.innerHTML = renderToolbar(dataUrl, data.mimeType, fileName) +
                            `<img src="${dataUrl}" class="doc-content" alt="وثيقة" style="object-fit:contain" />`;
                    } else if (data.mimeType === 'application/pdf') {
                        // عرض PDF بـ iframe + fallback إلى Google Docs Viewer للموبايل
                        const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
                        const viewer = isMobile
                            ? `<iframe class="doc-content" src="https://docs.google.com/gview?url=${encodeURIComponent(dataUrl)}&embedded=true"></iframe>`
                            : `<iframe class="doc-content" src="${dataUrl}"></iframe>`;
                        container.innerHTML = renderToolbar(dataUrl, data.mimeType, fileName) + viewer;
                    } else {
                        container.innerHTML = renderToolbar(dataUrl, data.mimeType, fileName) +
                            `<iframe class="doc-content" src="${dataUrl}"></iframe>`;
                    }
                })
                .catch(() => showError('فشل الاتصال بالخادم. تحقق من الإنترنت.'));
        } else {
            showError('لم يتم تحديد رقم العرض في الرابط.');
        }
    </script>
</body>
</html>
