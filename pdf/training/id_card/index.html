<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="https://sakralomh-bit.github.io/view-pdf/pdf/UV%20GULF.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id_card</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f4f5f7;
            font-family: Arial, sans-serif;
        }
        #pdf-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .message {
            font-size: 20px;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        /* مربع وهمي لإخفاء زر "النافذة الخارجية" الخاص بجوجل درايف تماماً */
        .hide-popout-mask {
            position: absolute;
            top: 0;
            right: 0;
            width: 70px;
            height: 60px;
            background-color: #1e1e1e;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="pdf-container">
        <div class="hide-popout-mask" id="mask"></div>
        <div class="message" id="status-message">جاري التحقق وجلب الملف...</div>
    </div>

    <script>
        // ===> ضع رابط الـ Web App الجديد هنا <===
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPMfMDJNHe3JQ4x2ZiRUKejIoZc3ZSWCbeaAFyKd4HBrEjam-OTo6UjNf-Ba7fP94n/exec';

        const urlParams = new URLSearchParams(window.location.search);
        const certificateId = urlParams.get('certificate');

        const container = document.getElementById('pdf-container');
        const statusMessage = document.getElementById('status-message');
        const mask = document.getElementById('mask');

        if (certificateId) {
            fetch(`${SCRIPT_URL}?certificate=${certificateId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // حقن رابط العرض المباشر في الـ iframe
                        container.innerHTML = `<div class="hide-popout-mask"></div><iframe src="${data.url}" allow="autoplay"></iframe>`;
                    } else {
                        mask.style.display = 'none';
                        statusMessage.innerHTML = `<span style="color:red;">عذراً:</span> ${data.message}`;
                    }
                })
                .catch(error => {
                    console.error('Fetch Error:', error);
                    mask.style.display = 'none';
                    statusMessage.innerHTML = '<span style="color:red;">حدث خطأ في الاتصال بقاعدة البيانات.</span>';
                });
        } else {
            mask.style.display = 'none';
            statusMessage.innerHTML = 'الرابط غير مكتمل، يرجى التأكد من وجود رقم العرض.';
        }
    </script>

</body>
</html>
