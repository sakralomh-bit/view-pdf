<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="https://sakralomh-bit.github.io/view-pdf/pdf/UV%20GULF.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id_card</title>
    <style>
        body { margin: 0; padding: 0; background: #f0f2f5; font-family: system-ui, -apple-system, sans-serif; }

        #root { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .error { color: #d32f2f; font-weight: bold; }
        
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .doc-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #525659; display: flex; justify-content: center; align-items: center; }
        .doc-content { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="root">
        <div class="message">
            <div class="loader"></div>
        </div>
    </div>

    <script>
        const root = document.getElementById('root');
        const urlParams = new URLSearchParams(window.location.search);
        const certificateId = urlParams.get('certificate');

        if (!certificateId) {
            showError('⚠️ لم يتم تحديد رقم العرض في الرابط.');
        } else {
            const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbyPMfMDJNHe3JQ4x2ZiRUKejIoZc3ZSWCbeaAFyKd4HBrEjam-OTo6UjNf-Ba7fP94n/exec';

            fetch(`${appsScriptUrl}?certificate=${certificateId}`)
                .then(res => res.json())
                .then(data => {
                    if (!data.success) return showError(`⚠️ ${data.message}`);

                    if (data.mimeType.includes('image')) {
                        renderImage(data);
                    } else {
                        renderPDF(data);
                    }
                })
                .catch((err) => {
                    console.error(err);
                    showError('⚠️ فشل في الاتصال بالخادم. تحقق من الإنترنت أو مفتاح API.');
                });
        }

        function base64ToBlob(b64, mime) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new Blob([bytes], { type: mime });
        }

        function renderPDF(data) {
            const blob = base64ToBlob(data.base64, data.mimeType);
            const url = URL.createObjectURL(blob);
            root.innerHTML = `
                <div class="doc-container">
                    <iframe src="${url}" class="doc-content" type="application/pdf"></iframe>
                </div>
            `;
        }

        function renderImage(data) {
            root.innerHTML = `
                <div class="doc-container">
                    <img src="data:${data.mimeType};base64,${data.base64}" class="doc-content" style="object-fit: contain; max-width: 100%; max-height: 100%;" alt="وثيقة" />
                </div>
            `;
        }

        function showError(msg) {
            root.innerHTML = `<div class="message error">${msg}</div>`;
        }
    </script>
</body>
</html>
