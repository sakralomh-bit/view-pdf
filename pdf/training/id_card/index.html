<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="https://sakralomh-bit.github.io/view-pdf/pdf/UV%20GULF.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id_card</title>
    <style>
        .doc-container {
            position: fixed; top: 55px; left: 0; right: 0; bottom: 0;
            background: #525659;
        }
        .doc-content { width: 100%; height: 100%; border: none; }
        .error { color: #d32f2f; }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <script>
        const root = document.getElementById('root');
        const urlParams = new URLSearchParams(window.location.search);
        const certificateId = urlParams.get('certificate');

        if (!certificateId) {
            showError('⚠️ لم يتم تحديد رقم العرض في الرابط.');
        } else {
            const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbyPMfMDJNHe3JQ4x2ZiRUKejIoZc3ZSWCbeaAFyKd4HBrEjam-OTo6UjNf-Ba7fP94n/exec';

            fetch(`${appsScriptUrl}?certificate=${certificateId}`)
                .then(res => res.json())
                .then(data => {
                    if (!data.success) return showError(`⚠️ ${data.message}`);

                    if (data.mimeType.includes('image')) {
                        renderImage(data);
                    } else {
                        renderPDF(data);
                    }
                })
                .catch(() => showError('⚠️ فشل في الاتصال بالخادم. تحقق من الإنترنت.'));
        }

        function base64ToBlob(b64, mime) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new Blob([bytes], { type: mime });
        }

        function renderPDF(data) {
            const blob = base64ToBlob(data.base64, data.mimeType);
            const url = URL.createObjectURL(blob); // ⚡ أسرع بكثير من base64

            root.innerHTML = `
                <div class="doc-container">
                    <iframe src="${url}" class="doc-content" type="application/pdf"></iframe>
                </div>
            `;
        }

        function renderImage(data) {
            root.innerHTML = `
                <div class="toolbar">
                    <h3>🖼️ عرض الوثيقة</h3>
                </div>
                <div class="doc-container">
                    <img src="data:${data.mimeType};base64,${data.base64}" class="doc-content" style="object-fit: contain;" alt="وثيقة" />
                </div>
            `;
        }

        function showError(msg) {
            root.innerHTML = `<p class="message error">${msg}</p>`;
        }
    </script>
</body>
</html>
