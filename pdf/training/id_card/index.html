<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام عرض الملفات</title>
    <style>
        /* تصفير الهوامش وجعل الملف يملأ الشاشة بالكامل */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f4f5f7;
            font-family: Arial, sans-serif;
        }
        #pdf-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* إخفاء الحدود للـ iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .message {
            font-size: 20px;
            color: #333;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="pdf-container">
        <div class="message" id="status-message">جاري التحقق وجلب الملف...</div>
    </div>

    <script>
        // ===> ضع رابط الـ Web App الذي نسخته من جوجل اب سكريبت هنا <===
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPMfMDJNHe3JQ4x2ZiRUKejIoZc3ZSWCbeaAFyKd4HBrEjam-OTo6UjNf-Ba7fP94n/exec';

        // استخراج رقم الشهادة من الـ URL (مثل: ?certificate=67261)
        const urlParams = new URLSearchParams(window.location.search);
        const certificateId = urlParams.get('certificate');

        const container = document.getElementById('pdf-container');
        const statusMessage = document.getElementById('status-message');

        if (certificateId) {
            // إرسال طلب GET لـ Google Apps Script
        fetch(`${SCRIPT_URL}?id=${certificateId}`)
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // تحويل Base64 إلى Blob لإنشاء رابط محلي خام
            const byteCharacters = atob(data.base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], {type: 'application/pdf'});
            
            // إنشاء رابط وعرضه في iframe (وإخفاء شريط أدوات المتصفح العلوي بإضافة #toolbar=0)
            const blobUrl = URL.createObjectURL(blob);
            container.innerHTML = `<iframe src="${blobUrl}#toolbar=0" allow="autoplay"></iframe>`;
        } else {
            statusMessage.innerHTML = `<span style="color:red;">عذراً:</span> ${data.message}`;
        }
    })
    .catch(error => {
        console.error('Fetch Error:', error);
        statusMessage.innerHTML = '<span style="color:red;">حدث خطأ في الاتصال بقاعدة البيانات.</span>';
    });
    </script>

</body>
</html>
